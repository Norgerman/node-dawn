name: Build cross platform
on:
  workflow_dispatch:
    inputs:
      force-build-image:
        description: Build Linux images without using the registry cache.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  DEPOT_TOOLS_HOME: ${{ github.workspace }}/depot_tools
  GO_VERSION: 1.26.5
  CMAKE_VERSION: 4.4.2
  NINJA_VERSION: 1.13.2

jobs:
  build-linux-image:
    name: Build native Linux image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    outputs:
      hash: ${{ steps.image.outputs.hash }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-26.04
          - arch: arm64
            os: ubuntu-26.04-arm

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve Linux image metadata
        id: image
        shell: bash
        run: |
          repo_lc="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          cache_hash="$({
            printf '%s\n%s\n%s\n' \
              "$CMAKE_VERSION" \
              "$GO_VERSION" \
              "$NINJA_VERSION"
            cat .github/build-linux.Dockerfile
          } | sha256sum | cut -c1-16)"

          base="ghcr.io/${repo_lc}/dawn-build"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "hash=${cache_hash}" >> "$GITHUB_OUTPUT"
          echo "platform-ref=${base}:${cache_hash}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push native Linux image
        uses: docker/build-push-action@v7
        with:
          context: .github
          file: .github/build-linux.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          pull: ${{ inputs['force-build-image'] == true }}
          no-cache: ${{ inputs['force-build-image'] == true }}
          tags: ${{ steps.image.outputs.platform-ref }}
          build-args: |
            CMAKE_VERSION=${{ env.CMAKE_VERSION }}
            GO_VERSION=${{ env.GO_VERSION }}
            NINJA_VERSION=${{ env.NINJA_VERSION }}
          cache-from: type=registry,ref=${{ steps.image.outputs.base }}:latest
          cache-to: type=inline
          provenance: false

  publish-linux-image:
    name: Publish multi-platform Linux image
    needs: build-linux-image
    runs-on: ubuntu-26.04
    outputs:
      base: ${{ steps.image.outputs.base }}

    steps:
      - name: Resolve Linux image metadata
        id: image
        shell: bash
        run: |
          repo_lc="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          base="ghcr.io/${repo_lc}/dawn-build"
          cache_hash="${{ needs.build-linux-image.outputs.hash }}"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "hash=${cache_hash}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-platform Linux manifest
        shell: bash
        run: |
          base="${{ steps.image.outputs.base }}"
          cache_hash="${{ steps.image.outputs.hash }}"
          manifest_tags=(--tag "${base}:${cache_hash}")

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            manifest_tags+=(--tag "${base}:latest")
          fi

          docker buildx imagetools create "${manifest_tags[@]}" \
            "${base}:${cache_hash}-amd64" \
            "${base}:${cache_hash}-arm64"
          docker buildx imagetools inspect "${base}:${cache_hash}"

  build:
    name: ${{ matrix.config.name }}
    needs: publish-linux-image
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: "Windows x64 MSVC",
              os: windows-2025-vs2026,
              preset: win32-x64,
              artifact: 'win32-x64-msvc',
              shell: pwsh,
              parallel: '$env:RUNNER_CPU_COUNT'
            }
          - {
              name: "Windows arm64 MSVC",
              os: windows-11-vs2026-arm,
              preset: win32-arm64,
              artifact: 'win32-arm64-msvc',
              shell: pwsh,
              parallel: '$env:RUNNER_CPU_COUNT'
            }
          - {
              name: "Linux x64 gnu",
              os: ubuntu-26.04,
              preset: linux-x64,
              artifact: linux-x64-gnu,
              platform: linux/amd64,
              shell: bash,
              parallel: '$RUNNER_CPU_COUNT'
            }
          - {
              name: "Linux arm64 gnu",
              os: ubuntu-26.04-arm,
              preset: linux-arm64,
              artifact: linux-arm64-gnu,
              platform: linux/arm64,
              shell: bash,
              parallel: '$RUNNER_CPU_COUNT'
            }
          - {
              name: "Macos arm64",
              os: macos-26,
              preset: darwin-arm64,
              artifact: darwin-arm64,
              shell: bash,
              parallel: '$RUNNER_CPU_COUNT'
            }
    defaults:
      run:
        shell: ${{ matrix.config.shell }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true
          path: node-dawn

      - name: Install depot tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24


      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup env(windows)
        if: startsWith(matrix.config.os, 'windows')
        run: |
          echo $env:DEPOT_TOOLS_HOME >> $env:GITHUB_PATH
          echo "RUNNER_CPU_COUNT=$([Environment]::ProcessorCount)" >> $env:GITHUB_ENV

      - name: Login to GHCR
        if: startsWith(matrix.config.os, 'ubuntu')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup env(Linux)
        if: startsWith(matrix.config.os, 'ubuntu')
        run: |
          echo $DEPOT_TOOLS_HOME >> $GITHUB_PATH
          echo "RUNNER_CPU_COUNT=$(nproc)" >> $GITHUB_ENV

      - name: Pull Linux build image
        if: startsWith(matrix.config.os, 'ubuntu')
        run: |
          image="${{ needs.publish-linux-image.outputs.base }}:latest"
          docker pull "$image"
          docker tag "$image" dawn-build:22.04

      - name: Setup env(Macos)
        if: startsWith(matrix.config.os, 'macos')
        run: |
          echo $DEPOT_TOOLS_HOME >> $GITHUB_PATH
          echo "RUNNER_CPU_COUNT=$(sysctl -n hw.logicalcpu)" >> $GITHUB_ENV
          brew install clang-format
          cmake --version
          clang --version

      - name: Sync DAWN
        working-directory: node-dawn/third_party/dawn
        continue-on-error: true
        run: |
          cp scripts/standalone-with-node.gclient .gclient
          gclient metrics --opt-out
          gclient sync --no-history

      - name: Build DAWN node binding (Linux, in pinned 22.04 container)
        if: startsWith(matrix.config.os, 'ubuntu')
        working-directory: node-dawn
        run: |
          docker run --rm \
            -e RUNNER_CPU_COUNT="$RUNNER_CPU_COUNT" \
            -v "${{ github.workspace }}:/work" \
            -w /work/node-dawn \
            dawn-build:22.04 bash -lc '
              set -e
              cmake -B ./build --preset ${{ matrix.config.preset }} .
              cmake --build ./build --preset ${{ matrix.config.preset }} --parallel "$RUNNER_CPU_COUNT"
            '

      - name: Build DAWN node binding
        if: ${{ ! startsWith(matrix.config.os, 'ubuntu') }}
        working-directory: node-dawn
        run: |
          cmake -B ./build --preset ${{ matrix.config.preset }} .
          cmake --build ./build --preset ${{ matrix.config.preset }} --parallel ${{ matrix.config.parallel }}

      - name: Copy runtime libs
        working-directory: node-dawn
        if: startsWith(matrix.config.os, 'windows')
        run: Copy-Item ./build/Release/*.dll ./bin

      - name: Verify artifact
        working-directory: node-dawn
        run: node -e "require('./bin/dawn.node')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dawn-${{ matrix.config.artifact }}
          path: node-dawn/bin/*
