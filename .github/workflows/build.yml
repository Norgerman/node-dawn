name: Build cross platform
on: workflow_dispatch

permissions:
  contents: read
  packages: write

env:
  DEPOT_TOOLS_HOME: ${{ github.workspace }}/depot_tools
  GO_VERSION: 1.26.5

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: "Windows x64 MSVC",
              os: windows-2025-vs2026,
              preset: win32-x64,
              artifact: 'win32-x64-msvc',
              shell: pwsh,
              parallel: '$env:RUNNER_CPU_COUNT'
            }
          - {
              name: "Windows arm64 MSVC",
              os: windows-11-vs2026-arm,
              preset: win32-arm64,
              artifact: 'win32-arm64-msvc',
              shell: pwsh,
              parallel: '$env:RUNNER_CPU_COUNT'
            }
          - {
              name: "Linux x64 gnu",
              os: ubuntu-26.04,
              preset: linux-x64,
              artifact: linux-x64-gnu,
              shell: bash,
              parallel: '$RUNNER_CPU_COUNT'
            }
          - {
              name: "Linux arm64 gnu",
              os: ubuntu-26.04-arm,
              preset: linux-arm64,
              artifact: linux-arm64-gnu,
              shell: bash,
              parallel: '$RUNNER_CPU_COUNT'
            }
          - {
              name: "Macos arm64",
              os: macos-26,
              preset: darwin-arm64,
              artifact: darwin-arm64,
              shell: bash,
              parallel: '$RUNNER_CPU_COUNT'
            }
    defaults:
      run:
        shell: ${{ matrix.config.shell }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true
          path: node-dawn

      - name: Install depot tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24


      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup env(windows)
        if: startsWith(matrix.config.os, 'windows')
        run: |
          echo $env:DEPOT_TOOLS_HOME >> $env:GITHUB_PATH
          echo "RUNNER_CPU_COUNT=$([Environment]::ProcessorCount)" >> $env:GITHUB_ENV

      - name: Setup env(Linux)
        if: startsWith(matrix.config.os, 'ubuntu')
        env:
          CMAKE_VERSION: 4.4.2
          NINJA_VERSION: 1.13.2
        run: |
          echo $DEPOT_TOOLS_HOME >> $GITHUB_PATH
          echo "RUNNER_CPU_COUNT=$(nproc)" >> $GITHUB_ENV
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo_lc="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          dockerfile_hash="$(sha256sum node-dawn/.github/build-linux.Dockerfile | cut -c1-12)"
          image="ghcr.io/${repo_lc}/dawn-build:${{ matrix.config.artifact }}-cmake${{ env.CMAKE_VERSION }}-go${{ env.GO_VERSION }}-ninja${{ env.NINJA_VERSION }}-${dockerfile_hash}"
          # Use the cached toolchain image when the exact tag already exists,
          # otherwise build it locally and upload it to GHCR as the cache.
          if ! docker pull "${image}"; then
            docker build \
              --build-arg CMAKE_VERSION=${{ env.CMAKE_VERSION }} \
              --build-arg GO_VERSION=${{ env.GO_VERSION }} \
              --build-arg NINJA_VERSION=${{ env.NINJA_VERSION }} \
              -t dawn-build:22.04 \
              -f node-dawn/.github/build-linux.Dockerfile \
              node-dawn/.github
            docker tag dawn-build:22.04 "${image}"
            docker push "${image}"
          else
            docker tag "${image}" dawn-build:22.04
          fi

      - name: Setup env(Macos)
        if: startsWith(matrix.config.os, 'macos')
        run: |
          echo $DEPOT_TOOLS_HOME >> $GITHUB_PATH
          echo "RUNNER_CPU_COUNT=$(sysctl -n hw.logicalcpu)" >> $GITHUB_ENV
          brew install clang-format
          cmake --version
          clang --version

      - name: Sync DAWN
        working-directory: node-dawn/third_party/dawn
        continue-on-error: true
        run: |
          cp scripts/standalone-with-node.gclient .gclient
          gclient metrics --opt-out
          gclient sync --no-history

      - name: Build DAWN node binding (Linux, in pinned 22.04 container)
        if: startsWith(matrix.config.os, 'ubuntu')
        working-directory: node-dawn
        run: |
          docker run --rm \
            -e RUNNER_CPU_COUNT="$RUNNER_CPU_COUNT" \
            -v "${{ github.workspace }}:/work" \
            -w /work/node-dawn \
            dawn-build:22.04 bash -lc '
              set -e
              cmake -B ./build --preset ${{ matrix.config.preset }} .
              cmake --build ./build --preset ${{ matrix.config.preset }} --parallel "$RUNNER_CPU_COUNT"
            '

      - name: Build DAWN node binding
        if: ${{ ! startsWith(matrix.config.os, 'ubuntu') }}
        working-directory: node-dawn
        run: |
          cmake -B ./build --preset ${{ matrix.config.preset }} .
          cmake --build ./build --preset ${{ matrix.config.preset }} --parallel ${{ matrix.config.parallel }}

      - name: Copy runtime libs
        working-directory: node-dawn
        if: startsWith(matrix.config.os, 'windows')
        run: Copy-Item ./build/Release/*.dll ./bin

      - name: Verify artifact
        working-directory: node-dawn
        run: node -e "require('./bin/dawn.node')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dawn-${{ matrix.config.artifact }}
          path: node-dawn/bin/*

